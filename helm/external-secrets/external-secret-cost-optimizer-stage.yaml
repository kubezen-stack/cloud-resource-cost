apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cost-optimizer-db-secret
  namespace: cost-optimizer
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cost-optimizer-db-secret
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: cost-optimizer-stage-db-credentials
        property: password
