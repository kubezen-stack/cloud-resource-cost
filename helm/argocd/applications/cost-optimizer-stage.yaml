apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cost-optimizer-stage
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kubezen-stack/cloud-resource-cost.git
    targetRevision: main
    path: helm/cost-optimizer
    helm:
      valueFiles:
        - values-stage.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: cost-optimizer

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
