replicaCount: 1

image:
  repository: ""
  pullPolicy: Always
  tag: "1.0.0-stage"

autoscaling:
  enabled: false

imagePullSecrets:
  - name: ecr-secret

service:
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30081

ingress:
  enabled: false

resources:
  main:
    requests:
      cpu: 250m
      memory: 384Mi
      storage: 1Gi
    limits:
      cpu: 750m
      memory: 768Mi
  migration:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  tests:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

app:
  name: cost-optimizer
  environment: stage
  debug: "false"
  version: "1.0.0"
  logLevel: INFO
  algorithm: "HS256"
  accessTokenExpireMinutes: 1440
  secretKey: ""

  corsOrigins:
    - "http://localhost:3000"

database:
  host: "REPLACED_BY_CI"
  port: 5432
  name: cost_optimizer_stage
  user: app_user
  password: ""

postgresql:
  enabled: false

livenessProbe:
  httpGet:
    path: /api/v1/health/health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/health/ready
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
