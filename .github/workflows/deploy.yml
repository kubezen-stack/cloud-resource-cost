name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "helm/**"
      - "docker/**"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage
          - prod
      image_tag:
        description: "Docker image tag (default: git sha)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment || 'dev' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.11.4"
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    name: "Build and Push Docker Image (${{ github.event.inputs.environment || 'dev' }})"
    runs-on: "ubuntu-latest"
    environment: "${{ github.event.inputs.environment || 'dev' }}"
    outputs:
      image_tag: ${{ steps.image_tag.outputs.TAG }}
      ecr_url: ${{ steps.ecr.outputs.ecr_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Cache Terraform plugins
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ${{ github.workspace }}/.terraform_cache
            terraform/environments/${{ env.ENVIRONMENT }}/.terraform
          key: terraform-${{ env.ENVIRONMENT }}-${{ hashFiles(format('terraform/environments/{0}/.terraform.lock.hcl', env.ENVIRONMENT)) }}
          restore-keys: |
            terraform-${{ env.ENVIRONMENT }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Create Terraform plugin cache dir
        run: mkdir -p ${{ github.workspace }}/.terraform_cache

      - name: Terraform Init
        working-directory: terraform/environments/${{ env.ENVIRONMENT }}
        run: terraform init -input=false -reconfigure
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform_cache

      - name: Get ECR URL from terraform
        id: ecr
        working-directory: terraform/environments/${{ env.ENVIRONMENT }}
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url 2>/dev/null | tail -n1)
          echo "ecr_url=${ECR_URL}" >> $GITHUB_OUTPUT
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform_cache

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@183a1442edf41672e66566b7fc560e297a290896 # v2.1.1

      - name: Set Image Tag
        id: image_tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker Image
        run: |
          docker buildx build \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          -f docker/Dockerfile \
          -t ${{ steps.ecr.outputs.ecr_url }}:${{ steps.image_tag.outputs.TAG }} \
          -t ${{ steps.ecr.outputs.ecr_url }}:${{ env.ENVIRONMENT }} \
          --load .

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: "${{ steps.ecr.outputs.ecr_url }}:${{ steps.image_tag.outputs.TAG }}"
          format: "json"
          output: "trivy-results.json"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: trivy-security-report-${{ env.ENVIRONMENT }}
          path: trivy-results.json
          retention-days: 7

      - name: Push Docker Image
        run: |
          docker push ${{ steps.ecr.outputs.ecr_url }}:${{ steps.image_tag.outputs.TAG }}
          docker push ${{ steps.ecr.outputs.ecr_url }}:${{ env.ENVIRONMENT }}

  helm-deploy:
    name: "Helm Deploy (${{ github.event.inputs.environment || 'dev' }})"
    runs-on: "self-hosted"
    environment: "${{ github.event.inputs.environment || 'dev' }}"
    needs: [build-and-push, sonarcloud]
    env:
      KUBECONFIG: /home/ubuntu/.kube/config
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Cache Cost-Optimizer Charts
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: helm/cost-optimizer/charts
          key: ${{ runner.os }}-cost-optimizer-${{ hashFiles('helm/cost-optimizer/Chart.yaml', 'helm/cost-optimizer/Chart.lock') }}

      - name: Cache Terraform plugins
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ${{ github.workspace }}/.terraform_cache
            terraform/environments/${{ env.ENVIRONMENT }}/.terraform
          key: terraform-${{ env.ENVIRONMENT }}-${{ hashFiles(format('terraform/environments/{0}/.terraform.lock.hcl', env.ENVIRONMENT)) }}
          restore-keys: |
            terraform-${{ env.ENVIRONMENT }}-

      - name: Create Terraform plugin cache dir
        run: mkdir -p ${{ github.workspace }}/.terraform_cache

      - name: Get ECR URL and public IP from terraform
        id: tf
        working-directory: terraform/environments/${{ env.ENVIRONMENT }}
        run: |
          terraform init -input=false -reconfigure
          ECR_URL=$(terraform output -raw ecr_repository_url 2>/dev/null | tail -n1)
          echo "ecr_url=${ECR_URL}" >> $GITHUB_OUTPUT
          # worker node public IP, used for the app hostname (see values-<env>.yaml ingress notes)
          PUBLIC_IP=$(terraform output -json ec2_instance_public_ips 2>/dev/null | jq -r '.[1] // .[0] // empty')
          echo "public_ip=${PUBLIC_IP}" >> $GITHUB_OUTPUT
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform_cache

      - name: Get kubeconfig from Secrets Manager
        run: |
          KUBECONFIG_DATA=$(aws secretsmanager get-secret-value \
            --secret-id "cost-optimizer-${{ env.ENVIRONMENT }}-kubeconfig" \
            --query SecretString \
            --output text)
          mkdir -p /home/ubuntu/.kube
          echo "$KUBECONFIG_DATA" > /home/ubuntu/.kube/config
          chmod 600 /home/ubuntu/.kube/config

      - name: Setup kubectl
        uses: azure/setup-kubectl@15650b3ad78fff148532a140b8a4c821796b2d7b # v5.0.0

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "v3.14.0"

      - name: Helm install dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update bitnami

      - name: Helm build dependencies
        run: |
          helm dependency build ./helm/cost-optimizer --skip-refresh

      - name: Create ECR Secret in K8s
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          kubectl create namespace cost-optimizer --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ecr-secret \
            --docker-server=${{ steps.tf.outputs.ecr_url }} \
            --docker-username=AWS \
            --docker-password="$ECR_PASSWORD" \
            --namespace cost-optimizer \
            --dry-run=client -o yaml | kubectl apply -f -

      # dev: DB lives in an in-cluster postgresql pod (bitnami subchart),
      #      password comes from a GitHub secret we choose ourselves.
      # stage/prod: DB is RDS, provisioned by Terraform, which already
      #      generated a random password and stored it (with host/port/name)
      #      in Secrets Manager. We just read it — never set it here.
      - name: Resolve database credentials
        id: db
        run: |
          if [ "${{ env.ENVIRONMENT }}" = "dev" ]; then
            echo "postgresql_enabled=true" >> $GITHUB_OUTPUT
            echo "db_host=cost-optimizer-postgresql" >> $GITHUB_OUTPUT
            echo "db_port=5432" >> $GITHUB_OUTPUT
            echo "::add-mask::${{ secrets.DB_PASSWORD }}"
            echo "db_password=${{ secrets.DB_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            DB_CREDS=$(aws secretsmanager get-secret-value \
              --secret-id "cost-optimizer-${{ env.ENVIRONMENT }}-db-credentials" \
              --query SecretString \
              --output text)
            DB_HOST=$(echo "$DB_CREDS" | jq -r '.host')
            DB_PORT=$(echo "$DB_CREDS" | jq -r '.port')
            DB_PASS=$(echo "$DB_CREDS" | jq -r '.password')
            echo "::add-mask::${DB_PASS}"
            echo "postgresql_enabled=false" >> $GITHUB_OUTPUT
            echo "db_host=${DB_HOST}" >> $GITHUB_OUTPUT
            echo "db_port=${DB_PORT}" >> $GITHUB_OUTPUT
            echo "db_password=${DB_PASS}" >> $GITHUB_OUTPUT
          fi

      - name: Helm deploy
        env:
          APP_SECRET: ${{ secrets.APP_SECRET_KEY }}
          DB_PASS: ${{ steps.db.outputs.db_password }}
        run: |
          helm upgrade --install cost-optimizer ./helm/cost-optimizer \
          -f ./helm/cost-optimizer/values-${{ env.ENVIRONMENT }}.yaml \
          --set image.repository=${{ steps.tf.outputs.ecr_url }} \
          --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
          --set app.secretKey=$APP_SECRET \
          --set postgresql.enabled=${{ steps.db.outputs.postgresql_enabled }} \
          --set database.host=${{ steps.db.outputs.db_host }} \
          --set database.port=${{ steps.db.outputs.db_port }} \
          --set database.password=$DB_PASS \
          --set postgresql.auth.password=$DB_PASS \
          --namespace cost-optimizer \
          --create-namespace \
          --timeout 600s \
          --wait

  run-tests:
    name: "Run Tests (${{ github.event.inputs.environment || 'dev' }})"
    runs-on: "self-hosted"
    environment: "${{ github.event.inputs.environment || 'dev' }}"
    needs: helm-deploy
    env:
      KUBECONFIG: /home/ubuntu/.kube/config
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get kubeconfig from Secrets Manager
        run: |
          KUBECONFIG_DATA=$(aws secretsmanager get-secret-value \
            --secret-id "cost-optimizer-${{ env.ENVIRONMENT }}-kubeconfig" \
            --query SecretString \
            --output text)
          mkdir -p /home/ubuntu/.kube
          echo "$KUBECONFIG_DATA" > /home/ubuntu/.kube/config
          chmod 600 /home/ubuntu/.kube/config

      - name: Wait for app to be ready
        env:
          KUBECONFIG: /home/ubuntu/.kube/config
        run: |
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=cost-optimizer \
            -n cost-optimizer \
            --timeout=120s

      - name: Port forward service
        run: |
          pkill -f "port-forward" || true
          kubectl port-forward svc/cost-optimizer 8888:80 -n cost-optimizer &
          sleep 10

      - name: Setup Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          cd src
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd src
          pytest tests/unit/ -v --junitxml=unit-results.xml
        continue-on-error: true

      - name: Run integration tests
        run: |
          cd src
          pytest tests/integration/ -v --junitxml=integration-results.xml
        continue-on-error: true

      - name: Run smoke tests
        env:
          APP_URL: "http://127.0.0.1:8888"
        run: |
          cd src
          pytest tests/smoke/ -v --junitxml=smoke-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-${{ env.ENVIRONMENT }}
          path: |
            src/unit-results.xml
            src/integration-results.xml
            src/smoke-results.xml
          retention-days: 5

      - name: Cleanup port-forward
        if: always()
        run: pkill -f "port-forward" || true

  helm-deploy-monitoring:
    name: "Helm Deploy Monitoring (${{ github.event.inputs.environment || 'dev' }})"
    runs-on: "self-hosted"
    environment: "${{ github.event.inputs.environment || 'dev' }}"
    needs: helm-deploy
    env:
      KUBECONFIG: /home/ubuntu/.kube/config
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Cache Monitoring Charts
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: helm/monitoring/charts
          key: ${{ runner.os }}-monitoring-${{ hashFiles('helm/monitoring/Chart.yaml', 'helm/monitoring/Chart.lock') }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get kubeconfig from Secrets Manager
        run: |
          KUBECONFIG_DATA=$(aws secretsmanager get-secret-value \
            --secret-id "cost-optimizer-${{ env.ENVIRONMENT }}-kubeconfig" \
            --query SecretString \
            --output text)
          mkdir -p /home/ubuntu/.kube
          echo "$KUBECONFIG_DATA" > /home/ubuntu/.kube/config
          chmod 600 /home/ubuntu/.kube/config

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "v3.14.0"

      - name: Helm install dependencies
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add victoriametrics https://victoriametrics.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update prometheus-community victoriametrics grafana

      - name: Helm update monitoring dependencies
        run: |
          helm dependency build ./helm/monitoring --skip-refresh

      - name: Helm deploy monitoring
        run: |
          helm upgrade --install monitoring ./helm/monitoring \
          -f ./helm/monitoring/values-${{ env.ENVIRONMENT }}.yaml \
          --namespace monitoring \
          --create-namespace \
          --timeout 600s \
          --wait

  argo-cd:
    name: "ArgoCD Deploy (${{ github.event.inputs.environment || 'dev' }})"
    runs-on: "self-hosted"
    environment: "${{ github.event.inputs.environment || 'dev' }}"
    # ArgoCD only makes sense once there's GitOps to do (dev deploys straight
    # via helm-deploy above). Skip it entirely for dev.
    if: ${{ (github.event.inputs.environment || 'dev') != 'dev' }}
    needs: helm-deploy-monitoring
    env:
      KUBECONFIG: /home/ubuntu/.kube/config
    steps:
      - name: Checkout code
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get kubeconfig from Secrets Manager
        run: |
          KUBECONFIG_DATA=$(aws secretsmanager get-secret-value \
            --secret-id "cost-optimizer-${{ env.ENVIRONMENT }}-kubeconfig" \
            --query SecretString \
            --output text)
          mkdir -p /home/ubuntu/.kube
          echo "$KUBECONFIG_DATA" > /home/ubuntu/.kube/config
          chmod 600 /home/ubuntu/.kube/config

      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: "v3.14.0"

      - name: Cache ArgoCD Charts
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: helm/argocd/charts
          key: ${{ runner.os }}-argocd-${{ hashFiles('helm/argocd/Chart.yaml', 'helm/argocd/Chart.lock') }}

      - name: Helm update ArgoCD dependencies
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          helm dependency build ./helm/argocd --skip-refresh

      - name: Helm deploy ArgoCD
        run: |
          helm upgrade --install argocd ./helm/argocd \
            -f ./helm/argocd/values-${{ env.ENVIRONMENT }}.yaml \
            --namespace argocd \
            --create-namespace \
            --timeout 300s \
            --wait

      - name: Save ArgoCD password to Secrets Manager
        run: |
          ARGOCD_PASSWORD=$(kubectl -n argocd get secret argocd-initial-admin-secret \
            -o jsonpath="{.data.password}" | base64 -d)

          aws secretsmanager put-secret-value \
            --secret-id "cost-optimizer-${{ env.ENVIRONMENT }}-argocd-password" \
            --secret-string "$ARGOCD_PASSWORD" \
            --region ${{ secrets.AWS_REGION }} || \
          aws secretsmanager create-secret \
            --name "cost-optimizer-${{ env.ENVIRONMENT }}-argocd-password" \
            --secret-string "$ARGOCD_PASSWORD" \
            --region ${{ secrets.AWS_REGION }}

      - name: Apply ArgoCD Application
        run: |
          kubectl apply -f helm/argocd/applications/cost-optimizer-${{ env.ENVIRONMENT }}.yaml

      - name: Get EC2 Public IP
        id: ec2_ip
        run: |
          EC2_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=cost-optimizer-${{ env.ENVIRONMENT }}-node-1" \
                     "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ec2_ip=${EC2_IP}" >> $GITHUB_OUTPUT

  notify:
    name: "Final Notification"
    runs-on: ubuntu-latest
    environment: "${{ github.event.inputs.environment || 'dev' }}"
    needs:
      [
        build-and-push,
        sonarcloud,
        helm-deploy,
        run-tests,
        helm-deploy-monitoring,
        argo-cd,
      ]
    if: always()
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ (needs.run-tests.result == 'success' && needs.helm-deploy-monitoring.result == 'success') && '✅' || '❌' }} *CI/CD Pipeline Finished*

            *Repository:* `${{ github.repository }}`
            *Env:* `${{ env.ENVIRONMENT }}`
            *Trigger:* `${{ github.event_name }}`

            *Results:*
            - Build & Push: `${{ needs.build-and-push.result }}`
            - SonarCloud: `${{ needs.sonarcloud.result }}`
            - Deploy App: `${{ needs.helm-deploy.result }}`
            - Tests: `${{ needs.run-tests.result }}`
            - Monitoring: `${{ needs.helm-deploy-monitoring.result }}`
            - ArgoCD: `${{ needs.argo-cd.result }}`

            [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
